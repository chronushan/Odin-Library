<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>The Odin Project - Library</title>
		<link rel="stylesheet" href="style.css" />
		<script src="script.js" defer></script>
	</head>
	<body>
		<h1>Henry's Library - The Odin Project</h1>
		<button
			type="button"
			class="newBook"
			command="show-modal"
			commandfor="popup"
		>
			New Book
		</button>
		<dialog id="popup">
			<p>Add a new book:</p>
			<form action="">
				<div>
					<label for="newTitle">Title: </label>
					<input type="text" id="newTitle" />
				</div>
				<div>
					<label for="newAuthor">Author: </label>
					<input type="text" id="newAuthor" />
				</div>
				<div>
					<label for="newStatusRead">Read</label>
					<input
						name="newStatus"
						type="radio"
						id="newStatusRead"
						value="read"
						checked
					/>
				</div>
				<div>
					<label for="newStatusNotRead">Not read</label>
					<input
						name="newStatus"
						type="radio"
						id="newStatusNotRead"
						value="not read"
					/>
				</div>
				<button id="addBook" type="button">Add</button>
			</form>
		</dialog>
	</body>
</html>
